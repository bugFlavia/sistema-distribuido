syntax = "proto3";
package media;

service MediaService{
    rpc CalcularMedia(Lote) returns (MediaTalhao){}
};

message Leitura {
    int32 talhaoId = 1;
    int32 sensorId = 2;
    string tipo = 3;
    string unidade = 4;
    repeated double valores = 5;
}

message Lote{
    int32 id = 1; 
    int32 talhaoId = 2; 
    repeated Leitura leituras = 3; 
    string timestamp = 4;
}

message MediaSensor{
    int32 sensorId = 1;
    string tipo = 2; 
    string unidade = 3; 
    double media = 4;
}

message MediaTalhao{
    int32 talhaoId = 1; 
    repeated MediaSensor mediasSensores = 2;
}